name: Nexus3D Build Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run regression suites
        run: npm run verify:rds && npm run verify:dfi && npm run test:rig && npm run test:logcat

      - name: Build Nexus3D
        run: npm run build
